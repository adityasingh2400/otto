<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LineForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237A1B2D'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' text-anchor='middle' fill='%23FAF6F1'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAF6F1;--ink:#2A0A10;--ink2:#6B4A3A;--dim:#9A8575;--maroon:#7A1B2D;--maroon-l:#9A3040;--line:#E4D7C8;
    --disp:'Fraunces',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;-webkit-font-smoothing:antialiased;position:relative}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
    background-image:radial-gradient(circle at 1px 1px,rgba(122,27,45,.045) 1px,transparent 1.4px);background-size:7px 7px}
  main{text-align:center;padding:24px;width:100%;max-width:600px;animation:in .8s cubic-bezier(.2,.7,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .logo{font:600 18px var(--disp);letter-spacing:-.01em;color:var(--ink);margin-bottom:34px}.logo b{color:var(--maroon)}
  h1{font:600 clamp(38px,7vw,68px)/1.04 var(--disp);letter-spacing:-.022em}
  h1 em{font-style:italic;color:var(--maroon)}
  form{display:flex;align-items:center;gap:8px;margin:40px auto 0;max-width:440px;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:8px 8px 8px 18px;box-shadow:0 18px 44px -28px rgba(42,10,16,.45);transition:.2s}
  form:focus-within{border-color:var(--maroon);box-shadow:0 22px 50px -26px rgba(122,27,45,.5)}
  input{flex:1;border:0;outline:0;background:transparent;font:500 15px var(--mono);color:var(--ink)}
  input::placeholder{color:var(--dim)}
  button{flex:none;width:46px;height:46px;border:0;border-radius:11px;background:var(--maroon);color:#fff;font-size:20px;cursor:pointer;transition:.18s;display:grid;place-items:center}
  button:hover{background:var(--maroon-l);transform:translateY(-1px)}button:active{transform:none}
  .hint{margin-top:18px;font:400 13px var(--mono);color:var(--dim)}
  @media(max-width:560px){.logo{margin-bottom:24px}}
</style>
</head>
<body>
<main>
  <div class="logo">Line<b>Forge</b></div>
  <h1>Let AI answer your phone. <em>Safely.</em></h1>
  <form id="f">
    <input id="u" value="https://www.piccino.com/" spellcheck="false" autocomplete="off" aria-label="Your business website" />
    <button aria-label="Build the line">→</button>
  </form>
  <p class="hint">paste a website · a stress-tested phone line in ~30s</p>
</main>
<script>
  document.getElementById('f').onsubmit=e=>{e.preventDefault();
    const u=document.getElementById('u').value.trim();
    location.href='/app/'+(u?('?url='+encodeURIComponent(u)):'');};
</script>
</body>
</html>
