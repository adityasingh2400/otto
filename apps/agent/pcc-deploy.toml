# Pipecat Cloud deploy for the Otto voice agent.
#   pc cloud auth login                         # one-time (your Pipecat Cloud account)
#   pc cloud secrets set otto-agent-secrets --file ../../.env   # upload runtime secrets
#   pc cloud deploy                             # build (Dockerfile.pcc) + deploy
# The agent fetches its AgentSpec from ORCH_BASE_URL (your Render orchestrator) at call time
# via /api/active-spec, so it answers as whatever business the UI last activated.
agent_name = "otto-agent"
secret_set = "otto-agent-secrets"
agent_profile = "agent-1x"

[krisp_viva]
	audio_filter = "tel"          # noise suppression tuned for phone calls

[scaling]
	min_agents = 5                # pre-warm 5 so concurrent Cekura phone calls don't wait on cold starts
	max_agents = 10
