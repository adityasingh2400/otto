[project]
name = "otto-orchestrator"
version = "0.1.0"
description = "Otto orchestrator — extract, build, swarm, heal, activate."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "otto-spec",
  # LLM providers (optional at runtime; guarded imports). cost is not a concern.
  "openai>=1.30",
  "anthropic>=0.40",
]

[tool.uv.sources]
otto-spec = { path = "../../packages/spec", editable = true }

[tool.uv]
package = false
