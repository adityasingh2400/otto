[project]
name = "otto-spec"
version = "0.1.0"
description = "Otto AgentSpec — the shared contract every component reads and writes."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otto_spec"]
