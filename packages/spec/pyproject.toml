[project]
name = "lineforge-spec"
version = "0.1.0"
description = "LineForge AgentSpec — the shared contract every component reads and writes."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineforge_spec"]
